services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourranktracker
      POSTGRES_PASSWORD: ourranktracker
      POSTGRES_DB: ourranktracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed for local tooling (psql, Prisma Studio). Drop this in production.
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ourranktracker -d ourranktracker']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ourranktracker:ourranktracker@db:5432/ourranktracker?schema=public
      # Override these in a .env file next to this compose file.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, e.g. openssl rand -base64 48}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      SERP_CONCURRENCY: ${SERP_CONCURRENCY:-3}
      MAX_KEYWORDS_PER_CHECK: ${MAX_KEYWORDS_PER_CHECK:-500}
      SERP_RESULTS: ${SERP_RESULTS:-100}
      SERP_CACHE_MINUTES: ${SERP_CACHE_MINUTES:-30}
    ports:
      - '3000:3000'

volumes:
  postgres-data:
